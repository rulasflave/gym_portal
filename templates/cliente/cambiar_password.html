{% extends "cliente/base_dash.html" %}
{% block title %}Configuración · Vitellas Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <span class="card-title">CAMBIAR CONTRASEÑA</span>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div style="padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px;{% if category=='error' %}background:rgba(255,50,50,.12);border:1px solid rgba(255,50,50,.4);color:#ff8a8a;{% else %}background:rgba(50,200,100,.12);border:1px solid rgba(50,200,100,.4);color:#8affb0;{% endif %}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label style="color:#8E8E8E;font-size:13px;margin-bottom:6px;display:block;">Nueva contraseña</label>
        <input type="password" name="nueva_password" required style="width:100%;height:48px;background:#000;border:2px solid #555;border-radius:10px;color:#858585;padding:0 14px;outline:none;font-size:15px;">
      </div>
      <div>
        <label style="color:#8E8E8E;font-size:13px;margin-bottom:6px;display:block;">Confirmar contraseña</label>
        <input type="password" name="confirmar_password" required style="width:100%;height:48px;background:#000;border:2px solid #555;border-radius:10px;color:#858585;padding:0 14px;outline:none;font-size:15px;">
      </div>
      <button type="submit" style="height:54px;background:#FFC400;border:none;border-radius:10px;color:#111;font-size:17px;font-weight:700;cursor:pointer;">Actualizar contraseña</button>
    </div>
  </form>
</div>
{% endblock %}

{% for noticia in noticias %}
<tr>
    <td>{{ noticia.id_noticia }}</td>
    <td>{{ noticia.titulo }}</td>
    <td>{{ noticia.fecha_publicacion.strftime('%d/%m/%Y') }}</td>
    <td>
        {% if noticia.activa %}
        <span class="admin-chip admin-chip-success">Activa</span>
        {% else %}
        <span class="admin-chip admin-chip-danger">Inactiva</span>
        {% endif %}
    </td>
    <td>
        <a class="admin-icon-btn" title="Editar" href="{{ url_for('admin.editar_noticia', id_noticia=noticia.id_noticia) }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
        </a>
    </td>
</tr>
{% endfor %}

{% extends "admin_base.html" %}

{% block title %}Nuevo Mensaje - Vitellas Hub{% endblock %}

{% block page_title %}Nuevo Mensaje{% endblock %}

{% block admin_content %}
<div class="admin-card" style="max-width:820px;">
    <form method="POST" id="msgForm">
        <div style="margin-bottom:16px;">
            <label class="admin-label" for="id_cliente">Cliente</label>
            <select class="admin-select" id="id_cliente" name="id_cliente" data-searchable required>
                <option value="">Seleccionar cliente...</option>
                {% for c in clientes %}
                <option value="{{ c.id_cliente }}">{{ c.numero_registro }} - {{ c.nombre_completo }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom:16px;">
            <label class="admin-label" for="asunto">Asunto</label>
            <input class="admin-input" type="text" id="asunto" name="asunto" required>
        </div>

        <div style="margin-bottom:16px;">
            <label class="admin-label">Cuerpo</label>
            <div id="editor-container"></div>
            <textarea name="cuerpo" id="cuerpoHidden" hidden></textarea>
        </div>

        <div style="display:flex; gap:12px; margin-top:20px;">
            <button type="submit" class="admin-btn admin-btn-primary"><i class="fas fa-paper-plane me-2"></i>Enviar</button>
            <a class="admin-btn admin-btn-secondary" href="{{ url_for('admin.mensajes') }}">Cancelar</a>
        </div>
    </form>
</div>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script>
var quill = new Quill('#editor-container', { theme: 'snow' });

var pickerEl = document.createElement('input');
pickerEl.type = 'file';
pickerEl.accept = 'image/*';
pickerEl.multiple = true;
pickerEl.style.display = 'none';

var toolbar = document.querySelector('.ql-toolbar');
var imgBtn = document.createElement('button');
imgBtn.type = 'button';
imgBtn.textContent = '🖼 Imagen';
toolbar.appendChild(imgBtn);

imgBtn.addEventListener('click', function(){
    pickerEl.value = '';
    pickerEl.click();
});

function prepareImage(file, cb){
    var fr = new FileReader();
    fr.onload = function(){
        var img = new Image();
        img.onload = function(){
            var MAX = 1000;
            if (img.width <= MAX && img.height <= MAX && file.size <= 300 * 1024) {
                cb(fr.result);
                return;
            }
            var ratio = Math.min(MAX / img.width, MAX / img.height);
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            cb(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = function(){ cb(fr.result); };
        img.src = fr.result;
    };
    fr.onerror = function(){ cb(null); };
    fr.readAsDataURL(file);
}

pickerEl.addEventListener('change', function(){
    Array.from(pickerEl.files).forEach(function(file){
        prepareImage(file, function(dataUrl){
            if (!dataUrl) return;
            var range = quill.getSelection();
            var idx = (range && range.index !== undefined) ? range.index : quill.getText().length;
            quill.insertEmbed(idx, 'image', dataUrl, 'user');
        });
    });
});

document.getElementById('msgForm').addEventListener('submit', function(){
    document.getElementById('cuerpoHidden').value = quill.root.innerHTML;
});
</script>
{% endblock %}

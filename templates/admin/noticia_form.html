{% extends "admin_base.html" %}

{% block title %}{{ titulo }} - Vitellas Hub{% endblock %}

{% block page_title %}{{ titulo }}{% endblock %}

{% block admin_content %}
<div class="admin-card" style="max-width:760px;">
    <form method="POST" enctype="multipart/form-data">
        <div style="margin-bottom:16px;">
            <label class="admin-label" for="titulo">Título</label>
            <input class="admin-input" type="text" id="titulo" name="titulo"
                   value="{{ noticia.titulo if noticia else '' }}" required>
        </div>

        <div style="margin-bottom:16px;">
            <label class="admin-label" for="contenido">Contenido</label>
            <textarea class="admin-textarea" id="contenido" name="contenido" rows="6" required>{{ noticia.contenido if noticia else '' }}</textarea>
        </div>

        <div style="margin-bottom:16px;">
            <label class="admin-label">Imagen (opcional)</label>
            {% if noticia and noticia.imagen_url %}
            <div style="margin-bottom:8px;">
                <small style="color: var(--text-secondary);">Imagen actual:</small><br>
                <img src="{{ noticia.imagen_url }}" alt="{{ noticia.titulo }}" style="max-height:150px; object-fit:cover; border-radius:8px;">
            </div>
            {% endif %}
            <div class="admin-form-grid">
                <div>
                    <label class="admin-label" for="imagen_url">Por URL</label>
                    <input class="admin-input" type="url" id="imagen_url" name="imagen_url"
                           placeholder="https://ejemplo.com/imagen.jpg"
                           value="{{ noticia.imagen_url if noticia and noticia.imagen_url else '' }}">
                </div>
                <div>
                    <label class="admin-label" for="imagen_file">Subir archivo</label>
                    <input class="admin-input" type="file" id="imagen_file" name="imagen_file" accept="image/*">
                    <small style="color: var(--text-secondary);">JPG, PNG, GIF (máx 5MB)</small>
                </div>
            </div>
        </div>

        <div style="margin-bottom:20px; display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="activa" name="activa"
                   {% if noticia and noticia.activa %}checked{% elif noticia is none %}checked{% endif %}>
            <label class="admin-label" for="activa" style="margin:0;">Activa (visible para clientes)</label>
        </div>

        <div style="display:flex; justify-content:space-between;">
            <a class="admin-btn admin-btn-secondary" href="{{ url_for('admin.noticias') }}">Volver</a>
            <button type="submit" class="admin-btn admin-btn-primary">{{ 'Actualizar' if noticia else 'Crear' }} Noticia</button>
        </div>
    </form>
</div>
{% endblock %}
